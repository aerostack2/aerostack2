# Coverage report filters, read by gcovr from the repo root (see .github/workflows/coverage.yaml).
root = .

# Only our sources: not tests, generated or vendored code.
exclude = build/
exclude = install/
exclude = .*/tests?/
exclude = .*/thirdpart(y|ies)/
exclude = .*/ekf_c_code\.

exclude-throw-branches = yes

# CMakeFiles/<version>/ holds CMake's compiler probes, also built with --coverage.
gcov-exclude-directories = .*/CMakeFiles/[0-9.]+/.*
gcov-ignore-errors = no_working_dir_found
gcov-ignore-parse-errors = negative_hits.warn_once_per_file
