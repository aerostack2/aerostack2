# =============================================================================
# as2_drone_bringup 설정 파일
# 드론 부팅 시 자동 실행되는 노드들의 파라미터를 한 곳에서 관리한다.
# =============================================================================

# -----------------------------------------------------------------------------
# 공통 설정
# -----------------------------------------------------------------------------
namespace: drone0          # 드론 네임스페이스
use_sim_time: false         # 시뮬레이션 시간 사용 여부 (Gazebo 등 사용 시 true)

# -----------------------------------------------------------------------------
# Phase 1 — 노드 시작 지연 (초)
# platform 시작 후 각 노드까지 대기 시간.
# 하드웨어 연결 속도에 따라 조정한다.
# -----------------------------------------------------------------------------
startup_delay:
  state_estimator: 3.0     # platform 이후 state_estimator 시작 대기 (초)
  controller: 5.0          # platform 이후 controller 시작 대기 (초)
  behaviors: 7.0           # platform 이후 behaviors 시작 대기 (초)

# -----------------------------------------------------------------------------
# Phase 1-1. platform 노드 설정
# -----------------------------------------------------------------------------
platform:
  # 실제 드론: as2_platform_mavlink
  # 시뮬레이션: as2_platform_multirotor_simulator
  pkg: as2_platform_mavlink
  # platform_config_file 미지정 시 패키지 기본값 사용

# -----------------------------------------------------------------------------
# Phase 1-2. state_estimator 노드 설정
# 사용 가능한 플러그인:
#   ground_truth             — 시뮬레이션 (ground_truth 토픽 사용)
#   ground_truth_odometry_fuse — 시뮬레이션 + 오도메트리 융합
#   mocap_pose               — 실내 모션캡처 시스템
#   raw_odometry             — 외부 오도메트리 소스
# -----------------------------------------------------------------------------
state_estimator:
  plugin_name: ground_truth

# -----------------------------------------------------------------------------
# Phase 1-3. controller_manager 노드 설정
# 사용 가능한 플러그인:
#   pid_speed_controller           — PID 기반 속도 제어 (일반 멀티로터)
#   differential_flatness_controller — 미분 평탄화 기반 궤적 제어 (고기동)
# -----------------------------------------------------------------------------
controller:
  plugin_name: pid_speed_controller

# -----------------------------------------------------------------------------
# Phase 2. Motion Behaviors 설정
# composable_motion_behaviors 에 포함된 behavior 플러그인 선택.
# 미지정 시 각 behavior의 패키지 기본 플러그인 사용.
# -----------------------------------------------------------------------------
behaviors:
  takeoff_plugin_name: ""   # 비워두면 패키지 기본값 사용
  land_plugin_name: ""
  go_to_plugin_name: ""
  follow_path_plugin_name: ""
