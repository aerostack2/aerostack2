[package]
name = "as2_cli"
publish = true

[package.build]
# pin: each backend release can mark pixi.lock stale. Bump it together with a fresh `pixi lock`.
backend = { name = "pixi-build-ros", version = "0.7.6.*" }

[package.build.config]
extra-package-mappings = [{ "python3-click" = { conda = ["click"] } }]
