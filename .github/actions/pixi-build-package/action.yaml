name: pixi-build-package
description: >-
  Build one package with pixi for one ROS distro. pixi builds the package's
  aerostack2 dependencies from source first. See build.sh for how the distro
  is chosen.

inputs:
  distro:
    description: The pixi feature with the ROS distro's channels (humble, jazzy, ...)
    required: true
  path:
    description: Folder of the package to build, relative to the repository root
    required: true

runs:
  using: composite
  steps:
    - uses: prefix-dev/setup-pixi@v0.11.2
      with:
        pixi-version: v0.83.0
        run-install: false
    - shell: bash
      env:
        DISTRO: ${{ inputs.distro }}
        PACKAGE_PATH: ${{ inputs.path }}
      run: '"$GITHUB_ACTION_PATH/build.sh" "$DISTRO" "$PACKAGE_PATH"'
