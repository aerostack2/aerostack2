name: clone-external
description: >-
  Clone another GitHub repository into src/, along with the repositories
  listed in its dependencies.repos file, if it has one.

inputs:
  repo:
    description: Repository to clone, as owner/name
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        REPO: ${{ inputs.repo }}
      run: |
        apt-get update -qq
        apt-get install -y -qq git python3-vcstool > /dev/null
        dest="src/${REPO#*/}"
        git clone --depth 1 "https://github.com/$REPO.git" "$dest"
        if [ -f "$dest/dependencies.repos" ]; then
          vcs import src < "$dest/dependencies.repos"
        fi
