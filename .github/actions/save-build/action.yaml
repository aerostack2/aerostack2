name: save-build
description: >-
  Upload a package's build (install/<package>) so later jobs can reuse it with
  restore-builds.

inputs:
  distro:
    description: ROS 2 distribution the build was made for
    required: true
  package:
    description: Package whose build to save
    required: true

runs:
  using: composite
  steps:
    # tar keeps file permissions and symlinks, which artifacts would drop.
    - name: Pack the build
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: tar -czf "install-$PACKAGE.tar.gz" "install/$PACKAGE"
    - uses: actions/upload-artifact@v4
      with:
        name: install-${{ inputs.distro }}-${{ inputs.package }}
        path: install-${{ inputs.package }}.tar.gz
        retention-days: 1
        overwrite: true
