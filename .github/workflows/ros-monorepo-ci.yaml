name: ros-monorepo-ci

# Builds and tests the workspace for one ROS 2 distribution, one job per
# package so each package gets its own check and its own short log:
#
#   plan → stage1 → stage2 → stage3 → packages (all in parallel) → result
#
# The stages build the base packages (the ones most others depend on) in
# dependency order. Each job uploads its build, and later jobs download those
# builds instead of rebuilding them.

on:
  workflow_call:
    inputs:
      distro:
        description: ROS 2 distribution (humble, jazzy, ...)
        type: string
        required: true
      base-packages:
        description: Packages built once and shared by every package job (space-separated)
        type: string
        default: ""
      exclude-packages:
        description: Packages never built (space-separated)
        type: string
        default: ""
      apt-packages:
        description: Extra apt packages that rosdep does not install (space-separated)
        type: string
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      base: ${{ steps.plan.outputs.base }}
      stage1: ${{ steps.plan.outputs.stage1 }}
      stage2: ${{ steps.plan.outputs.stage2 }}
      stage3: ${{ steps.plan.outputs.stage3 }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet colcon-common-extensions
      - id: plan
        env:
          BASE: ${{ inputs.base-packages }}
          EXCLUDE: ${{ inputs.exclude-packages }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Pull requests build only what changed (plus its dependents).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mode=(--diff "origin/$BASE_REF")
          else
            mode=(--all)
          fi
          python3 .github/scripts/plan_packages.py "${mode[@]}" --base "$BASE" --exclude "$EXCLUDE" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  stage1:
    name: ${{ matrix.package }}
    needs: [plan]
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.stage1 != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: osrf/ros:${{ inputs.distro }}-desktop
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage1) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/aerostack2
      - uses: ./src/aerostack2/.github/actions/colcon-build-test
        with:
          distro: ${{ inputs.distro }}
          build: ${{ matrix.package }}
          skip: ${{ needs.plan.outputs.base }}
          test: ${{ matrix.test && matrix.package || '' }}
          apt-packages: ${{ inputs.apt-packages }}
      # tar keeps file permissions and symlinks, which artifacts would drop.
      - name: Pack the build
        run: tar -czf "install-${{ matrix.package }}.tar.gz" "install/${{ matrix.package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: install-${{ inputs.distro }}-${{ matrix.package }}
          path: install-${{ matrix.package }}.tar.gz
          retention-days: 1
          overwrite: true

  stage2:
    name: ${{ matrix.package }}
    needs: [plan, stage1]
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.stage2 != '[]'
      && needs.stage1.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: osrf/ros:${{ inputs.distro }}-desktop
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage2) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/aerostack2
      - uses: actions/download-artifact@v4
        with:
          pattern: install-${{ inputs.distro }}-*
          merge-multiple: true
      - name: Unpack earlier builds
        run: for f in install-*.tar.gz; do tar -xzf "$f"; done
      - uses: ./src/aerostack2/.github/actions/colcon-build-test
        with:
          distro: ${{ inputs.distro }}
          build: ${{ matrix.package }}
          skip: ${{ needs.plan.outputs.base }}
          test: ${{ matrix.test && matrix.package || '' }}
          apt-packages: ${{ inputs.apt-packages }}
      # tar keeps file permissions and symlinks, which artifacts would drop.
      - name: Pack the build
        run: tar -czf "install-${{ matrix.package }}.tar.gz" "install/${{ matrix.package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: install-${{ inputs.distro }}-${{ matrix.package }}
          path: install-${{ matrix.package }}.tar.gz
          retention-days: 1
          overwrite: true

  stage3:
    name: ${{ matrix.package }}
    needs: [plan, stage1, stage2]
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.stage3 != '[]'
      && needs.stage1.result != 'failure'
      && needs.stage2.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: osrf/ros:${{ inputs.distro }}-desktop
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.stage3) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/aerostack2
      - uses: actions/download-artifact@v4
        with:
          pattern: install-${{ inputs.distro }}-*
          merge-multiple: true
      - name: Unpack earlier builds
        run: for f in install-*.tar.gz; do tar -xzf "$f"; done
      - uses: ./src/aerostack2/.github/actions/colcon-build-test
        with:
          distro: ${{ inputs.distro }}
          build: ${{ matrix.package }}
          skip: ${{ needs.plan.outputs.base }}
          test: ${{ matrix.test && matrix.package || '' }}
          apt-packages: ${{ inputs.apt-packages }}
      # tar keeps file permissions and symlinks, which artifacts would drop.
      - name: Pack the build
        run: tar -czf "install-${{ matrix.package }}.tar.gz" "install/${{ matrix.package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: install-${{ inputs.distro }}-${{ matrix.package }}
          path: install-${{ matrix.package }}.tar.gz
          retention-days: 1
          overwrite: true

  packages:
    name: ${{ matrix.package }}
    needs: [plan, stage1, stage2, stage3]
    # Skipped stages are fine (nothing to build there); failed ones are not.
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.packages != '[]'
      && needs.stage1.result != 'failure'
      && needs.stage2.result != 'failure'
      && needs.stage3.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: osrf/ros:${{ inputs.distro }}-desktop
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/aerostack2
      - if: needs.plan.outputs.base != ''
        uses: actions/download-artifact@v4
        with:
          pattern: install-${{ inputs.distro }}-*
          merge-multiple: true
      - if: needs.plan.outputs.base != ''
        name: Unpack the base builds
        run: for f in install-*.tar.gz; do tar -xzf "$f"; done
      - uses: ./src/aerostack2/.github/actions/colcon-build-test
        with:
          distro: ${{ inputs.distro }}
          build: ${{ matrix.package }}
          skip: ${{ needs.plan.outputs.base }}
          test: ${{ matrix.package }}
          apt-packages: ${{ inputs.apt-packages }}

  # One check that sums up the whole distro, so branch protection can require
  # it without knowing which package jobs ran.
  result:
    needs: [plan, stage1, stage2, stage3, packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed or was skipped on purpose
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
