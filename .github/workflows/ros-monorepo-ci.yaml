name: ros-monorepo-ci

# Builds and tests the workspace for one ROS 2 distribution, one job per
# package so each package gets its own check and its own short log:
#
#   plan → msgs → core → shared → packages (all in parallel) → result
#
# plan     decides which packages this change affects (colcon-plan)
# msgs,    build the packages most others depend on, in that order, and save
# core,    their builds (save-build)
# shared
# packages build every other affected package on top of those builds
#          (restore-builds), including packages from other repositories
#          (clone-external)
# result   one check that passes when every job passed or was skipped
#
# Every job runs only if nothing before it failed and the plan gave it work.

on:
  workflow_call:
    inputs:
      distro:
        description: ROS 2 distribution (humble, jazzy, ...)
        type: string
        required: true
      msgs:
        description: Packages built first, e.g. message packages (space-separated)
        type: string
        default: ""
      core:
        description: Packages built after msgs (space-separated)
        type: string
        default: ""
      shared:
        description: Packages built after core, that many others depend on (space-separated)
        type: string
        default: ""
      exclude-packages:
        description: Packages never built (space-separated)
        type: string
        default: ""
      apt-packages:
        description: Extra apt packages that rosdep does not install (space-separated)
        type: string
        default: ""
      external-repos:
        description: >-
          Other GitHub repositories (owner/name) whose packages also get their
          own job when something they depend on changes (space-separated).
          A dependencies.repos file at their root is imported with vcs.
        type: string
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      prebuilt: ${{ steps.plan.outputs.prebuilt }}
      msgs: ${{ steps.plan.outputs.msgs }}
      core: ${{ steps.plan.outputs.core }}
      shared: ${{ steps.plan.outputs.shared }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        uses: ./.github/actions/colcon-plan
        with:
          msgs: ${{ inputs.msgs }}
          core: ${{ inputs.core }}
          shared: ${{ inputs.shared }}
          exclude-packages: ${{ inputs.exclude-packages }}
          external-repos: ${{ inputs.external-repos }}
          # Changes to this CI build every package, so they get tested.
          ci-files: >-
            .github/workflows/ci.yaml
            .github/workflows/ros-monorepo-ci.yaml
            .github/actions/colcon-build-test/
            .github/actions/colcon-plan/

  msgs:
    name: ${{ matrix.package }}
    needs: [plan]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.msgs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: osrf/ros:${{ inputs.distro }}-desktop
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.msgs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/aerostack2
      - uses: ./src/aerostack2/.github/actions/colcon-build-test
        with:
          distro: ${{ inputs.distro }}
          package: ${{ matrix.package }}
          test: ${{ matrix.test }}
          skip: ${{ needs.plan.outputs.prebuilt }}
          apt-packages: ${{ inputs.apt-packages }}
      - uses: ./src/aerostack2/.github/actions/save-build
        with:
          distro: ${{ inputs.distro }}
          package: ${{ matrix.package }}

  core:
    name: ${{ matrix.package }}
    needs: [plan, msgs]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.core != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: osrf/ros:${{ inputs.distro }}-desktop
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.core) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/aerostack2
      - uses: ./src/aerostack2/.github/actions/restore-builds
        with:
          distro: ${{ inputs.distro }}
      - uses: ./src/aerostack2/.github/actions/colcon-build-test
        with:
          distro: ${{ inputs.distro }}
          package: ${{ matrix.package }}
          test: ${{ matrix.test }}
          skip: ${{ needs.plan.outputs.prebuilt }}
          apt-packages: ${{ inputs.apt-packages }}
      - uses: ./src/aerostack2/.github/actions/save-build
        with:
          distro: ${{ inputs.distro }}
          package: ${{ matrix.package }}

  shared:
    name: ${{ matrix.package }}
    needs: [plan, msgs, core]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.shared != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: osrf/ros:${{ inputs.distro }}-desktop
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shared) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/aerostack2
      - uses: ./src/aerostack2/.github/actions/restore-builds
        with:
          distro: ${{ inputs.distro }}
      - uses: ./src/aerostack2/.github/actions/colcon-build-test
        with:
          distro: ${{ inputs.distro }}
          package: ${{ matrix.package }}
          test: ${{ matrix.test }}
          skip: ${{ needs.plan.outputs.prebuilt }}
          apt-packages: ${{ inputs.apt-packages }}
      - uses: ./src/aerostack2/.github/actions/save-build
        with:
          distro: ${{ inputs.distro }}
          package: ${{ matrix.package }}

  packages:
    name: ${{ matrix.package }}
    needs: [plan, msgs, core, shared]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: osrf/ros:${{ inputs.distro }}-desktop
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/aerostack2
      - if: matrix.repo != ''
        uses: ./src/aerostack2/.github/actions/clone-external
        with:
          repo: ${{ matrix.repo }}
      - if: needs.plan.outputs.prebuilt != ''
        uses: ./src/aerostack2/.github/actions/restore-builds
        with:
          distro: ${{ inputs.distro }}
      - uses: ./src/aerostack2/.github/actions/colcon-build-test
        with:
          distro: ${{ inputs.distro }}
          package: ${{ matrix.package }}
          test: ${{ matrix.test }}
          skip: ${{ needs.plan.outputs.prebuilt }}
          apt-packages: ${{ inputs.apt-packages }}

  # One check that sums up the whole distro, so branch protection can require
  # it without knowing which package jobs ran.
  result:
    needs: [plan, msgs, core, shared, packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed or was skipped on purpose
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
