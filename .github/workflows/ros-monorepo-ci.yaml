name: ros-monorepo-ci

# Builds and tests the workspace for one ROS 2 distribution, one job per
# package so each package gets its own check and its own short log:
#
#   plan → packages (all in parallel) → result
#
# plan      decides which packages this change affects (colcon-plan): the ones
#           with changed files, plus every package that depends on them
# packages  one job per affected package: builds the package together with
#           what it depends on, then tests it (colcon-build-test). Packages
#           from other repositories are cloned first (clone-external).
# result    one check that passes when every job passed or was skipped

on:
  workflow_call:
    inputs:
      distro:
        description: ROS 2 distribution (humble, jazzy, ...)
        type: string
        required: true
      exclude-packages:
        description: Packages never built (space-separated)
        type: string
        default: ""
      apt-packages:
        description: Extra apt packages that rosdep does not install (space-separated)
        type: string
        default: ""
      external-repos:
        description: >-
          Other GitHub repositories (owner/name) whose packages also get their
          own job when something they depend on changes (space-separated).
          A dependencies.repos file at their root is imported with vcs.
        type: string
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        uses: ./.github/actions/colcon-plan
        with:
          exclude-packages: ${{ inputs.exclude-packages }}
          external-repos: ${{ inputs.external-repos }}
          # colcon never reads the pixi files, so changing them builds nothing.
          ignore-files: pixi.toml pixi.lock
          # Changes to this CI build every package, so they get tested.
          ci-files: >-
            .github/workflows/ci.yaml
            .github/workflows/ros-monorepo-ci.yaml
            .github/actions/

  packages:
    name: ${{ matrix.package }}
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: osrf/ros:${{ inputs.distro }}-desktop
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/aerostack2
      - if: matrix.repo != ''
        uses: ./src/aerostack2/.github/actions/clone-external
        with:
          repo: ${{ matrix.repo }}
      - uses: ./src/aerostack2/.github/actions/colcon-build-test
        with:
          distro: ${{ inputs.distro }}
          package: ${{ matrix.package }}
          apt-packages: ${{ inputs.apt-packages }}

  # One check that sums up the whole distro, so branch protection can require
  # it without knowing which package jobs ran.
  result:
    needs: [plan, packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job passed or was skipped on purpose
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
