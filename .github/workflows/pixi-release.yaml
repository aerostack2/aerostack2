name: pixi-release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  publish:
    name: publish-${{ matrix.distro }}-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        platform: [linux-64, linux-aarch64, osx-arm64]
        include:
          - platform: linux-64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: osx-arm64
            runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publishing skips packages that already exist, so a missed version bump would pass silently.
      - name: Check the tag matches the package versions
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          versions=$(for f in $(git ls-files '*/pixi.toml'); do grep -o '<version>[^<]*' "$(dirname "$f")/package.xml"; done | sort -u)
          [ "$versions" = "<version>$TAG" ] || { echo "::error::Tag $TAG does not match the package versions: $versions"; exit 1; }

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          run-install: false

      - name: Build against ${{ matrix.distro }} (distro comes from the default environment)
        if: matrix.distro != 'humble'
        run: pixi workspace environment add default --feature ${{ matrix.distro }} --force

      - name: Publish
        run: pixi publish --to https://prefix.dev/aerostack2/aerostack2-${{ matrix.distro }}
