name: docker-build

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, ready_for_review]
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: humble
            dockerfile: docker/humble/Dockerfile
            image: aerostack2/humble
          - distro: jazzy
            dockerfile: docker/jazzy/Dockerfile
            image: aerostack2/jazzy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose -f docker/compose.yaml config -q
      - name: Build ${{ matrix.distro }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
