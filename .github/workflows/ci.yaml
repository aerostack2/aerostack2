name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: lint
      - name: Lint commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pixi run -e lint commitlint --from "$BASE" --to "$HEAD"
      - name: Lint PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | pixi run -e lint commitlint

  ros:
    name: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: humble
            platforms: >-
              aerostack2/as2_platform_betaflight
              aerostack2/as2_platform_crazyflie
              aerostack2/as2_platform_dji_osdk
              aerostack2/as2_platform_dji_psdk
              aerostack2/as2_platform_mavlink
              aerostack2/as2_platform_pixhawk
              aerostack2/as2_platform_tello
          - distro: jazzy
            apt-packages: libgeographiclib-dev
            platforms: >-
              aerostack2/as2_platform_betaflight
              aerostack2/as2_platform_crazyflie
              aerostack2/as2_platform_dji_psdk
              aerostack2/as2_platform_mavlink
              aerostack2/as2_platform_pixhawk
              aerostack2/as2_platform_tello
    uses: ./.github/workflows/ros-monorepo-ci.yaml
    with:
      distro: ${{ matrix.distro }}
      exclude-packages: aerostack2
      apt-packages: ${{ matrix.apt-packages || '' }}
      external-repos: ${{ matrix.platforms }}
