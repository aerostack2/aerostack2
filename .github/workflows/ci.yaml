name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel in-flight runs when a PR receives a new push; never cancel main builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each distro runs as its own pipeline, so one never waits on the other.
  ros:
    name: ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: humble
            platforms: >-
              aerostack2/as2_platform_crazyflie
              aerostack2/as2_platform_dji_osdk
              aerostack2/as2_platform_dji_psdk
              aerostack2/as2_platform_mavlink
              aerostack2/as2_platform_pixhawk
              aerostack2/as2_platform_tello
          - distro: jazzy
            apt-packages: libgeographiclib-dev
            # TODO: port crazyflie, dji_osdk and dji_psdk to jazzy
            platforms: >-
              aerostack2/as2_platform_mavlink
              aerostack2/as2_platform_pixhawk
              aerostack2/as2_platform_tello
    uses: ./.github/workflows/ros-monorepo-ci.yaml
    with:
      distro: ${{ matrix.distro }}
      # The packages most others depend on, built once per distro.
      base-packages: >-
        as2_msgs
        as2_core
        as2_behavior
        as2_motion_reference_handlers
        as2_gazebo_assets
      # The metapackage depends on everything; building it in its own job
      # would rebuild the whole workspace.
      exclude-packages: aerostack2
      apt-packages: ${{ matrix.apt-packages || '' }}
      # Aerial platforms live in their own repositories. They build against
      # this one, so they run when as2_core or as2_msgs change.
      external-repos: ${{ matrix.platforms }}
