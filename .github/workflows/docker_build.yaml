name: docker_build

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose -f docker/compose.yaml config -q
      - name: Build humble image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/humble/Dockerfile
          push: false
          tags: aerostack2/humble:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build jazzy image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/jazzy/Dockerfile
          push: false
          tags: aerostack2/jazzy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max