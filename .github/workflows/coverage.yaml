name: coverage

on:
  schedule:
    - cron: '7 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          environments: coverage
          locked: true

      - name: Build
        run: pixi run -e coverage coverage-build

      - name: Test
        if: ${{ !cancelled() }}
        run: pixi run -e coverage coverage-test

      - name: Report
        if: ${{ !cancelled() }}
        run: pixi run -e coverage coverage-report

      - name: Upload coverage
        if: ${{ !cancelled() && github.repository == 'aerostack2/aerostack2' }}
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage/coverage.xml
          disable_search: true
          plugins: noop
          use_oidc: true
          fail_ci_if_error: true

      - name: List test results
        id: tests
        if: ${{ !cancelled() }}
        run: echo "files=$(find build -path '*/test_results/*.xml' -o -name pytest.xml | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload test results
        if: ${{ !cancelled() && github.repository == 'aerostack2/aerostack2' && steps.tests.outputs.files != '' }}
        uses: codecov/codecov-action@v7.1.1
        with:
          report_type: test_results
          files: ${{ steps.tests.outputs.files }}
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
