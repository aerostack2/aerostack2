name: docker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      # A manual run pushes only from main, so a branch cannot overwrite nightly-*:latest.
      push: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check for new commits
        id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log -1 --since='24 hours ago' --format=%H)" ]; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo build=false >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.distro }} / ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        platform: [amd64, arm64]
    env:
      IMAGE: aerostack2/${{ github.event_name != 'release' && 'nightly-' || '' }}${{ matrix.distro }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Validate compose file
        run: docker compose -f docker/compose.yaml config -q
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: ROS_DISTRO=${{ matrix.distro }}
          platforms: linux/${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.distro }}-${{ matrix.platform }},mode=max
      - name: Smoke test
        run: docker run --rm "${IMAGE}:ci" ros2 pkg prefix as2_core
      - name: Login to Docker Hub
        if: needs.changes.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Pushed untagged; the publish job tags both platforms as one multi-arch image.
      - name: Push by digest
        id: push
        if: needs.changes.outputs.push == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: ROS_DISTRO=${{ matrix.distro }}
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Save digest
        if: needs.changes.outputs.push == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - name: Upload digest
        if: needs.changes.outputs.push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.distro }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: ${{ matrix.distro }} / publish
    needs: [changes, build]
    if: needs.changes.outputs.push == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [humble, jazzy]
    env:
      IMAGE: aerostack2/${{ github.event_name != 'release' && 'nightly-' || '' }}${{ matrix.distro }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.distro }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=,format=long,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
      - name: Docker Hub description
        if: github.event_name == 'release'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ env.IMAGE }}
