name: docker

# PRs only build. The nightly pushes aerostack2/nightly-<distro>, a release pushes aerostack2/<distro>.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-flight runs when a PR receives a new push; never cancel nightly or release builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The nightly skips the build when main has no commits from the last 24 hours.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check for new commits
        id: check
        run: |
          if [ "${{ github.event_name }}" != schedule ] || [ -n "$(git log -1 --since='24 hours ago' --format=%H)" ]; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo build=false >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.distro }} / ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        platform: [amd64]
    env:
      # A manual run pushes only from main, so a branch cannot overwrite nightly-*:latest.
      PUSH: ${{ github.event_name == 'release' || github.ref == 'refs/heads/main' }}
      IMAGE: aerostack2/${{ github.event_name != 'release' && 'nightly-' || '' }}${{ matrix.distro }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Validate compose file
        run: docker compose -f docker/compose.yaml config -q
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=,format=long,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.distro }}/Dockerfile
          platforms: linux/${{ matrix.platform }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.distro }}-${{ matrix.platform }},mode=max
      - name: Smoke test
        run: docker run --rm "${IMAGE}:latest" ros2 pkg prefix as2_core
      - name: Login to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Every layer is already in the builder, so this step only uploads.
      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.distro }}/Dockerfile
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Docker Hub description
        if: github.event_name == 'release'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ env.IMAGE }}
