name: lyrical

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main

# Cancel in-flight runs when a PR receives a new push; never cancel main builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:lyrical-desktop
    steps:
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y lcov python3-vcstool python3-colcon-lcov-result python3-colcon-coveragepy-result python3-rosdep python3-pip python3-colcon-common-extensions python3-empy libgeographiclib-dev
      - name: Setup ros
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: lyrical
      - name: build and test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: >
            as2_msgs
            as2_cli
            as2_core
            as2_platform_gazebo
            as2_platform_multirotor_simulator
            as2_motion_controller
            as2_motion_reference_handlers
            as2_map_server
            as2_behavior_tree
            as2_behavior
            as2_behaviors_motion
            as2_behaviors_object_perception
            as2_behaviors_path_planning
            as2_behaviors_platform
            as2_behaviors_swarm_flocking
            as2_behaviors_trajectory_generation
            as2_gazebo_assets
            as2_state_estimator
            as2_realsense_interface
            as2_usb_camera_interface
            as2_python_api
            as2_alphanumeric_viewer
            as2_keyboard_teleoperation
            as2_rviz_plugins
            as2_visualization
            as2_external_object_to_tf
            as2_geozones
          target-ros2-distro: lyrical
          colcon-defaults: |
            {
              "build": {
                "mixin": ["coverage-gcc"]
              },
              "test": {
                "parallel-workers" : 1
              }
            }
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
