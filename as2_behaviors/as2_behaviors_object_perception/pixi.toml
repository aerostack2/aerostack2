[package]
name = "as2_behaviors_object_perception"
version = "0.0.0"

[package.build]
backend = { name = "pixi-build-ros", version = "==0.4.1" }

[package.build.config]
extra-package-mappings = [{
  as2_behavior = { conda = [] },
  as2_core = { conda = [] },
  as2_msgs = { conda = [] },
  as2_usb_camera_interface = { conda = [] },
}]

[package.host-dependencies]
as2_core = { path = "../../as2_core" }
as2_msgs = { path = "../../as2_msgs" }
as2_behavior = { path = "../as2_behavior" }
as2_usb_camera_interface = { path = "../../as2_hardware_drivers/as2_usb_camera_interface" }

[package.run-dependencies]
as2_core = { path = "../../as2_core" }
as2_msgs = { path = "../../as2_msgs" }
as2_behavior = { path = "../as2_behavior" }
as2_usb_camera_interface = { path = "../../as2_hardware_drivers/as2_usb_camera_interface" }
