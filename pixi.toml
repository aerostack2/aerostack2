[workspace]
preview = ["pixi-build"]
authors = ["Alvaro Gaona <alvgaona@gmail.com>"]
channels = ["conda-forge"]
name = "aerostack2"
platforms = [
  "linux-64",
  "linux-aarch64",
  "osx-arm64"
]
version = "1.1.3"

[system-requirements]
libc = { family = "glibc", version = "2.34" }

# pin: libcxx 23 removed std::wstring_convert, still used by rosidl_runtime_cpp
# headers. Drop when ROS or conda-forge ships a fix.
[workspace.target.osx-arm64.build-variants]
c_compiler_version = ["22"]
cxx_compiler_version = ["22"]

[tasks]
clean = "rm -rf build/ install/ log/"
build-testing = "bash tools/build_humble_testing.sh"
test-offline = "bash tools/run_colcon_tests_offline.sh"
test-result-offline = "bash tools/run_colcon_tests_offline.sh --result"
test-pkg = "sh -c 'colcon test --packages-up-to \"$0\" --event-handlers console_direct+'"
test-result = "colcon test-result --verbose"
# Docker compose wrappers (see docker/compose.yaml)
"docker:build" = "docker compose -f docker/compose.yaml build"
"docker:build-humble" = "docker compose -f docker/compose.yaml build humble"
"docker:build-nightly" = "docker compose -f docker/compose.yaml --profile nightly build nightly-humble"
"docker:build-jazzy" = "docker compose -f docker/compose.yaml build jazzy"
"docker:run" = "docker run -it --rm aerostack2/humble"
"docker:pull" = "docker compose -f docker/compose.yaml --profile nightly pull humble nightly-humble"
"docker:clean" = "sh -c 'docker image rm -f aerostack2/humble aerostack2/nightly-humble aerostack2/jazzy || true'"

[dependencies]
aerostack2 = { path = "./aerostack2" }

[feature.jazzy]
channels = ["robostack-jazzy"]

[feature.jazzy.dependencies]
ros-jazzy-ros2cli = ">=0.32.8,<0.33"
ros-jazzy-ros2pkg = ">=0.32.8,<0.33"

[feature.humble]
channels = ["robostack-humble"]

[feature.humble.dependencies]
ros-humble-ros2cli = ">=0.18.17,<0.19"
ros-humble-ros2pkg = ">=0.18.17,<0.19"
ros-humble-ament-lint-auto = ">=0.12.15,<0.13"
ros-humble-ament-lint-common = ">=0.12.15,<0.13"
ros-humble-ament-cmake-gtest = ">=1.3.14,<1.4"
ros-humble-ament-cmake-pytest = ">=1.3.14,<1.4"
gcc_linux-64 = ">=16,<17"
gxx_linux-64 = ">=16,<17"

[environments]
jazzy = ["jazzy"]
humble = ["humble"]
default = ["humble"]
