name: aerostack2

# Build context is the repo root. Every image builds docker/Dockerfile with its ROS_DISTRO;
# nightly is a profile so `docker compose build` does not rebuild them twice.
services:
  humble:
    image: aerostack2/humble
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: humble

  nightly-humble:
    image: aerostack2/nightly-humble
    profiles: ["nightly"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: humble

  jazzy:
    image: aerostack2/jazzy
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: jazzy

  nightly-jazzy:
    image: aerostack2/nightly-jazzy
    profiles: ["nightly"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ROS_DISTRO: jazzy
