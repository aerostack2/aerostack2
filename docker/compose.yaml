name: aerostack2

# Build context is the repo root. Each nightly image shares its distro's Dockerfile;
# nightly is a profile so `docker compose build` does not rebuild them twice.
services:
  humble:
    image: aerostack2/humble
    build:
      context: ..
      dockerfile: docker/humble/Dockerfile

  nightly-humble:
    image: aerostack2/nightly-humble
    profiles: ["nightly"]
    build:
      context: ..
      dockerfile: docker/humble/Dockerfile

  jazzy:
    image: aerostack2/jazzy
    build:
      context: ..
      dockerfile: docker/jazzy/Dockerfile

  nightly-jazzy:
    image: aerostack2/nightly-jazzy
    profiles: ["nightly"]
    build:
      context: ..
      dockerfile: docker/jazzy/Dockerfile
