name: aerostack2

# Build and pull the Aerostack2 container images.
#
#   docker compose build                       # build all images
#   docker compose build humble                # build a single image
#   docker compose pull humble nightly-humble  # pull published images
#   docker compose down --rmi all              # remove locally built images
#
# Supported ROS distributions: humble (release) and jazzy (source build).
# Only `humble` and `nightly-humble` are published to Docker Hub
# (https://hub.docker.com/u/aerostack2). `jazzy` is a local-only build
# from the local repository checkout.
services:
  humble:
    image: aerostack2/humble
    build:
      context: ..
      dockerfile: docker/humble/Dockerfile

  nightly-humble:
    image: aerostack2/nightly-humble
    build:
      context: ..
      dockerfile: docker/humble/Dockerfile

  jazzy:
    image: aerostack2/jazzy
    build:
      context: ..
      dockerfile: docker/jazzy/Dockerfile
